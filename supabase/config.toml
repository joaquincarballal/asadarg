project_id = "asadarg"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "https://asadarg.pages.dev"
# Los "/**" habilitan redirectTo a rutas internas (ej. /eventos/:id/unirse) después del
# login con Google — si no, GoTrue solo permite la raíz exacta y el signInWithOAuth con
# redirectTo a una subruta cae de nuevo a site_url, perdiendo el deep link de invitación.
# El wildcard de subdominio cubre además las preview deployments de Cloudflare Pages
# (*.asadarg.pages.dev, tanto los alias de branch como las URLs con hash de cada deploy).
additional_redirect_urls = [
  "https://asadarg.pages.dev/**",
  "https://*.asadarg.pages.dev/**",
  "http://localhost:5173/**",
]
jwt_expiry = 3600
enable_signup = true

[auth.external.google]
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"

[storage]
enabled = true
