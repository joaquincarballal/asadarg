<span class="font-label-md text-label-md text-primary mt-sm">Subir foto de portada</span>
<!-- Hidden input -->
<input accept="image/*" class="absolute inset-0 opacity-0 cursor-pointer" type="file"/>
</div>
<!-- Event Name -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant" for="event-name">Nombre del evento</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-DEFAULT px-md py-3 font-body-lg text-body-lg text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors placeholder:text-outline" id="event-name" placeholder="Ej. Asado de los Sábados" type="text"/>
</div>
<!-- Date Picker -->

<label class="font-label-md text-label-md text-on-surface-variant" for="event-date">¿Cuándo nos juntamos?</label>

<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-DEFAULT pl-md pr-12 py-3 font-body-lg text-body-lg text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors appearance-none relative z-10 bg-transparent" id="event-date" type="date"/>
<span class="material-symbols-outlined absolute right-md top-1/2 -translate-y-1/2 text-on-surface-variant z-0 pointer-events-none" style="font-variation-settings: 'FILL' 0;">calendar_month</span>
</div>
</div>
<!-- Invite Friends -->
<div class="flex flex-col gap-xs mt-sm">
<label class="font-label-md text-label-md text-on-surface-variant">Participantes</label>
<button class="w-full flex items-center justify-between bg-surface-container-low rounded-DEFAULT p-md border border-transparent hover:border-primary-container transition-colors active:scale-[0.98]" type="button">
<div class="flex items-center gap-sm">
<div class="w-10 h-10 rounded-full bg-primary-container flex items-center justify-center text-on-primary-container">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">group_add</span>
</div>
<span class="font-body-md text-body-md text-on-surface">Invitar amigos</span>
</div>
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 0;">share</span>
</button>
