<div class="absolute inset-y-1 left-1 w-[calc(50%-4px)] bg-white rounded-full shadow-sm transition-transform duration-300 ease-in-out" id="toggle-slider"></div>
<button class="flex-1 py-2 font-label-md text-label-md text-center rounded-full relative z-10 transition-colors text-primary font-bold" id="toggle-carne" onclick="setToggle('carne')">
                Carne / Achuras
            </button>
<button class="flex-1 py-2 font-label-md text-label-md text-center rounded-full relative z-10 transition-colors text-on-surface-variant" id="toggle-extras" onclick="setToggle('extras')">
                Extras / Bebidas
            </button>
</div>
<script>
            function setToggle(type) {
                const slider = document.getElementById('toggle-slider');
                const carneBtn = document.getElementById('toggle-carne');
                const extrasBtn = document.getElementById('toggle-extras');
                
                if(type === 'carne') {
                    slider.style.transform = 'translateX(0)';
                    carneBtn.classList.add('text-primary', 'font-bold');
                    carneBtn.classList.remove('text-on-surface-variant');
                    extrasBtn.classList.remove('text-primary', 'font-bold');
                    extrasBtn.classList.add('text-on-surface-variant');
                } else {
                    slider.style.transform = 'translateX(100%)';
                    extrasBtn.classList.add('text-primary', 'font-bold');
                    extrasBtn.classList.remove('text-on-surface-variant');
                    carneBtn.classList.remove('text-primary', 'font-bold');
                    carneBtn.classList.add('text-on-surface-variant');
                }
            }
        </script>
